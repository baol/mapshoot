[package]
name = "mapshoot"
version = "0.1.0"
edition = "2024"
description = "Native HERE/XYZ raster map rendering with GeoJSON overlays"

[dependencies]
font8x8 = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
