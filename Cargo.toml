[package]
name = "mapshoot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native HERE/OSM/CARTO/XYZ raster map rendering with GeoJSON overlays"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["map", "static-map", "geojson", "tiles", "png"]
categories = ["command-line-utilities", "graphics", "multimedia::images"]
repository = "https://github.com/baol/mapshoot"
homepage = "https://github.com/baol/mapshoot"

[dependencies]
ab_glyph = "0.2"
font8x8 = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny-skia = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
