[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Linux ships as fully static musl only: one artifact per arch runs unmodified on
# glibc distributions and Alpine alike, with no runtime library dependencies.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Emit SLSA build provenance attestations for the release artifacts.
# Verify with: gh attestation verify <file> --repo baol/mapshoot
github-attestations = true
# Emit a CycloneDX SBOM (bom.xml) per project alongside the archives.
cargo-cyclonedx = true
# Embed the dependency tree into the binaries (audit with `cargo audit`).
cargo-auditable = true
# Extra files to drop at the root of every archive/installer. README,
# LICENSE-MIT and LICENSE-APACHE are auto-detected; the embedded marker font's
# license is not, and OFL 1.1 requires it to ship with the binary.
include = ["assets/OFL.txt"]

# Native deb/rpm/apk packages, built from the static musl binaries by nfpm.
# dist has no built-in support for these formats, so they are produced as extra
# artifacts during the global build phase (which has all local artifacts staged
# in target/distrib/). Filenames are version-less by design: the asset list must
# be static across releases, and each GitHub Release is its own namespace.
[[dist.extra-artifacts]]
build = ["bash", "packaging/build-packages.sh"]
artifacts = [
    "target/distrib/mapshoot-amd64.deb",
    "target/distrib/mapshoot-arm64.deb",
    "target/distrib/mapshoot-amd64.rpm",
    "target/distrib/mapshoot-arm64.rpm",
    "target/distrib/mapshoot-amd64.apk",
    "target/distrib/mapshoot-arm64.apk",
    # checksums over the six packages above, written by the same script
    "target/distrib/mapshoot-packages.sha256",
]
